apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nervixclusters.nervix.io
spec:
  group: nervix.io
  names:
    categories: []
    kind: NervixCluster
    plural: nervixclusters
    shortNames:
      - nvx
    singular: nervixcluster
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.replicas
          name: Replicas
          type: integer
        - jsonPath: .status.readyReplicas
          name: Ready
          type: integer
        - jsonPath: .spec.image
          name: Image
          type: string
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: Auto-generated derived type for NervixClusterSpec via `CustomResource`
          properties:
            spec:
              properties:
                clusterId:
                  nullable: true
                  type: string
                image:
                  type: string
                initialClusterParameters:
                  default: {}
                  description: |-
                    Cluster parameters the operator commits once, with `ALTER CLUSTER SET`, while it
                    initializes a new cluster, which needs `initialDefaultUserPasswordSecretRef`.
                    Nodes never receive cluster parameters as startup options: every start uses the cluster's
                    committed parameters, and only `ALTER CLUSTER SET` changes them afterwards.
                  properties:
                    replicaCount:
                      description: |-
                        `REPLICA_COUNT`: how many nodes besides its owner hold a replica of each piece of
                        runtime state.
                      format: int32
                      minimum: 0.0
                      nullable: true
                      type: integer
                  type: object
                initialDefaultUserPasswordSecretRef:
                  description: Secret key used only while initializing the default user on a new cluster.
                  nullable: true
                  properties:
                    key:
                      description: Key containing the initial password.
                      type: string
                    name:
                      description: Name of a Secret in the NervixCluster namespace.
                      type: string
                  required:
                    - key
                    - name
                  type: object
                localAccess:
                  nullable: true
                  properties:
                    bootstrapGrpcNodePort:
                      default: 31390
                      format: int32
                      type: integer
                    bootstrapObservabilityNodePort:
                      default: 31090
                      format: int32
                      type: integer
                    bootstrapWebConsoleNodePort:
                      default: 31420
                      format: int32
                      type: integer
                    enabled:
                      default: true
                      type: boolean
                    firstNodeGrpcNodePort:
                      default: 31391
                      format: int32
                      type: integer
                    firstNodeObservabilityNodePort:
                      default: 31091
                      format: int32
                      type: integer
                    firstNodeWebConsoleNodePort:
                      default: 31421
                      format: int32
                      type: integer
                  type: object
                logFilter:
                  nullable: true
                  type: string
                replicas:
                  default: 3
                  format: int32
                  type: integer
                resources:
                  default:
                    cpuRequest: 250m
                    memoryLimit: 3Gi
                    memoryRequest: 512Mi
                  properties:
                    cpuRequest:
                      default: 250m
                      type: string
                    memoryLimit:
                      default: 3Gi
                      description: |-
                        Memory limit of each node's container.
                        A node refuses to start when its memory limit cannot hold its memory budgets.
                      type: string
                    memoryRequest:
                      default: 512Mi
                      type: string
                  type: object
                storage:
                  default: 20Gi
                  description: |-
                    Size of each node's data volume.
                    A node refuses to start on a volume smaller than any of its storage quotas.
                  type: string
              required:
                - image
              type: object
            status:
              nullable: true
              properties:
                conditions:
                  default: []
                  items:
                    description: Condition contains details for one aspect of the current state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: message is a human readable message indicating details about the transition. This may be an empty string.
                        type: string
                      observedGeneration:
                        description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                        format: int64
                        type: integer
                      reason:
                        description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                initialClusterParameters:
                  description: |-
                    The cluster parameters the operator committed while it initialized the cluster, empty when
                    it was asked for none. Absent when the operator did not initialize the cluster.
                  nullable: true
                  properties:
                    replicaCount:
                      description: |-
                        `REPLICA_COUNT`: how many nodes besides its owner hold a replica of each piece of
                        runtime state.
                      format: int32
                      minimum: 0.0
                      nullable: true
                      type: integer
                  type: object
                initializationPhase:
                  enum:
                    - initializing
                    - removingCredentials
                    - initialized
                    - null
                  nullable: true
                  type: string
                nodes:
                  default: []
                  items:
                    properties:
                      grpcAdvertiseAddress:
                        type: string
                      interconnectAdvertiseAddress:
                        type: string
                      name:
                        type: string
                      ordinal:
                        format: int32
                        type: integer
                      webConsoleAdvertiseAddress:
                        type: string
                    required:
                      - grpcAdvertiseAddress
                      - interconnectAdvertiseAddress
                      - name
                      - ordinal
                      - webConsoleAdvertiseAddress
                    type: object
                  type: array
                observedGeneration:
                  format: int64
                  nullable: true
                  type: integer
                readyReplicas:
                  default: 0
                  format: int32
                  type: integer
                replicas:
                  default: 0
                  format: int32
                  type: integer
              type: object
          required:
            - spec
          title: NervixCluster
          type: object
      served: true
      storage: true
      subresources:
        status: {}
