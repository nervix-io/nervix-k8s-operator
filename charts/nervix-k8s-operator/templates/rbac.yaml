{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "nervix-k8s-operator.fullname" . }}
  labels:
    {{- include "nervix-k8s-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["nervix.io"]
    resources: ["nervixclusters"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["nervix.io"]
    resources: ["nervixclusters/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  # Commits the initial cluster parameters with the bootstrap pod's nervix-cli while a cluster
  # initializes. A WebSocket exec is authorized as get, or as create where Kubernetes requires it.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "nervix-k8s-operator.fullname" . }}
  labels:
    {{- include "nervix-k8s-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "nervix-k8s-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "nervix-k8s-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
