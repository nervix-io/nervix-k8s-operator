apiVersion: v1
kind: Namespace
metadata:
  name: nervix-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nervix-k8s-operator
  namespace: nervix-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nervix-k8s-operator
rules:
  - apiGroups: ["nervix.io"]
    resources: ["nervixclusters"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["nervix.io"]
    resources: ["nervixclusters/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nervix-k8s-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nervix-k8s-operator
subjects:
  - kind: ServiceAccount
    name: nervix-k8s-operator
    namespace: nervix-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nervix-k8s-operator
  namespace: nervix-system
  labels:
    app.kubernetes.io/name: nervix-k8s-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nervix-k8s-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nervix-k8s-operator
    spec:
      serviceAccountName: nervix-k8s-operator
      containers:
        - name: operator
          image: ghcr.io/nervix-io/nervix-k8s-operator:dev
          imagePullPolicy: IfNotPresent
          args:
            - run
          env:
            - name: RUST_LOG
              value: info,nervix_k8s_operator=debug
