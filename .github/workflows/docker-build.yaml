name: Docker Build

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    name: metadata
    runs-on: ubuntu-latest
    outputs:
      timestamp: ${{ steps.meta.outputs.timestamp }}
    steps:
      - name: Compute image metadata
        id: meta
        run: |
          ts="$(date -u +'%Y%m%d%H%M%S')"
          echo "timestamp=${ts}" >> "${GITHUB_OUTPUT}"

  build:
    name: build-${{ matrix.arch }}
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Login to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally push arch image
        run: |
          image_repo="ghcr.io/nervix-io/nervix-k8s-operator"
          tag="${image_repo}:${{ needs.meta.outputs.timestamp }}-alpine-${{ matrix.arch }}"
          cache_scope="nervix-k8s-operator-alpine-${{ matrix.arch }}"
          push_image="true"
          if [[ "${{ github.event_name }}" == "pull_request" \
            && "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]]; then
            push_image="false"
          fi
          just docker-build \
            "${tag}" \
            "${{ matrix.platform }}" \
            "${push_image}" \
            "type=gha,scope=${cache_scope}" \
            "type=gha,mode=max,scope=${cache_scope}"

  publish:
    name: publish-manifest
    needs: [meta, build]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch image
        run: |
          base="ghcr.io/nervix-io/nervix-k8s-operator"
          ts="${{ needs.meta.outputs.timestamp }}"
          docker buildx imagetools create \
            -t "${base}:${ts}-alpine" \
            -t "${base}:latest" \
            "${base}:${ts}-alpine-amd64" \
            "${base}:${ts}-alpine-arm64"

  minikube:
    name: minikube
    needs: [meta, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install minikube
        run: |
          curl -Lo minikube https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
          sudo install minikube /usr/local/bin/minikube

      - name: Login to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install nervix-cli
        run: |
          image="ghcr.io/nervix-io/nervix:20260506054031-debian"
          docker pull "${image}"
          container="$(docker create "${image}")"
          trap 'docker rm -f "${container}" >/dev/null 2>&1 || true' EXIT
          docker cp "${container}:/usr/local/bin/nervix-cli" ./nervix-cli
          chmod +x ./nervix-cli

      - name: Deploy operator and verify cluster
        run: |
          profile="nervix-operator-ci"
          operator_image="ghcr.io/nervix-io/nervix-k8s-operator:${{ needs.meta.outputs.timestamp }}-alpine-amd64"

          just minikube-start "${profile}"

          if [[ "${{ github.event_name }}" != "pull_request" \
            || "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]]; then
            docker pull "${operator_image}"
          else
            just docker-build-local "${operator_image}"
          fi

          just minikube-load-operator "${profile}" "${operator_image}"
          just minikube-deploy "${profile}" "${operator_image}"
          just minikube-create-cluster "${profile}"
          just minikube-cli-check "${profile}" ./nervix-cli

      - name: Dump minikube state
        if: always()
        run: |
          kubectl --context nervix-operator-ci get nervixclusters -A || true
          kubectl --context nervix-operator-ci get pods,svc,statefulset,pvc -A || true
          kubectl --context nervix-operator-ci -n nervix-system logs deployment/nervix-k8s-operator --tail=200 || true
