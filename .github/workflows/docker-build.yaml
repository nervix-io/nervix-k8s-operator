name: Docker Build

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    name: metadata
    runs-on: ubuntu-latest
    outputs:
      timestamp: ${{ steps.meta.outputs.timestamp }}
    steps:
      - name: Compute image metadata
        id: meta
        run: |
          ts="$(date -u +'%Y%m%d%H%M%S')"
          echo "timestamp=${ts}" >> "${GITHUB_OUTPUT}"

  build:
    name: build-${{ matrix.arch }}
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Login to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally push arch image
        run: |
          image_repo="ghcr.io/nervix-io/nervix-k8s-operator"
          tag="${image_repo}:${{ needs.meta.outputs.timestamp }}-alpine-${{ matrix.arch }}"
          cache_scope="nervix-k8s-operator-alpine-${{ matrix.arch }}"
          push_image="true"
          if [[ "${{ github.event_name }}" == "pull_request" \
            && "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]]; then
            push_image="false"
          fi
          just docker-build \
            "${tag}" \
            "${{ matrix.platform }}" \
            "${push_image}" \
            "type=gha,scope=${cache_scope}" \
            "type=gha,mode=max,scope=${cache_scope}"

  publish:
    name: publish-manifest
    needs: [meta, build]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch image
        run: |
          base="ghcr.io/nervix-io/nervix-k8s-operator"
          ts="${{ needs.meta.outputs.timestamp }}"
          docker buildx imagetools create \
            -t "${base}:${ts}-alpine" \
            -t "${base}:latest" \
            "${base}:${ts}-alpine-amd64" \
            "${base}:${ts}-alpine-arm64"
